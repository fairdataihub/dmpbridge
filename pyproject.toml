[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dmpbridge"
version = "0.1.0"
description = "DMP Bridge: PDF to structured section extraction pipeline"
authors = [
    { name = "Nahid Zeinali" }
]
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "pdfplumber>=0.11",
    "requests>=2.28",
    "Pillow>=11.0",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
notebooks = [
    "matplotlib>=3.10",
    "seaborn>=0.13",
    "pandas>=2.3",
]

[project.scripts]
dmpbridge          = "dmpbridge.cli:main"
dmpbridge-wholedoc = "dmpbridge.runner:main"
dmpbridge-evaluate = "dmpbridge.evaluate:main"
dmpbridge-pdf      = "dmpbridge.pdf_direct:main"

[tool.setuptools.packages.find]
include = ["dmpbridge*"]

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = ["venv", "notebooks", "__pycache__", "*.egg-info"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # line too long — prompt strings in classifier.py are intentionally long
]