[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dmpbridge"
version = "0.1.0"
description = "DMP Bridge: PDF to structured section extraction pipeline"
authors = [
    { name = "Nahid Zeinali" }
]
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "pdfplumber>=0.11",
    "requests>=2.28",
    "Pillow>=11.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "python-multipart>=0.0.20",
]
notebooks = [
    "matplotlib>=3.10",
    "seaborn>=0.13",
    "pandas>=2.3",
]
lighton = [
    "torch>=2.0",
    "transformers>=4.40",
    "pymupdf>=1.24",
    "huggingface_hub>=0.23",
    "safetensors>=0.4",
    "pillow>=10.0",
]
docling = [
    "docling>=2.0",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
dmpbridge              = "dmpbridge.cli.main:main"
dmpbridge-wholedoc     = "dmpbridge.cli.wholedoc_cmd:main"
dmpbridge-evaluate     = "dmpbridge.evaluation.evaluate:main"
dmpbridge-evaluate-new = "dmpbridge.evaluation.annotation_rules:main"
dmpbridge-experiment   = "dmpbridge.evaluation.experiment:main"

[tool.setuptools.packages.find]
include = ["dmpbridge*"]

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = ["venv", "notebooks", "__pycache__", "*.egg-info"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # line too long — prompt strings in classifier.py are intentionally long
]