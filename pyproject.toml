[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dmpbridge"
version = "0.1.0"
description = "DMP Bridge: PDF to structured section extraction pipeline"
authors = [
    { name = "Nahid Zeinali" }
]
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "pdfplumber>=0.10",
    "requests>=2.28",
]

[project.scripts]
dmpbridge = "dmpbridge.cli:main"

[tool.setuptools.packages.find]
include = ["dmpbridge*"]