[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dmpbridge"
version = "0.1.0"
description = "DMP Bridge: PDF to structured section extraction pipeline"
authors = [
    { name = "Nahid Zeinali" }
]
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "pdfplumber",
    "pymupdf",
    "pandas",
    "pydantic",
    "jsonschema",
    "python-dotenv",
    "tqdm"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]