<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dmpbridge — Structured Review</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:     #0d1117;
  --s1:     #161b22;
  --s2:     #1c2128;
  --s3:     #21262d;
  --border: #30363d;
  --text:   #c9d1d9;
  --dim:    #8b949e;
  --bright: #f0f6fc;
  --accent: #58a6ff;
  --green:  #3fb950;
  --gold:   #e3b341;
  --orange: #f0883e;
  --red:    #ff7b72;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  font-size: 13px;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── Header ── */
.header {
  background: var(--s1);
  border-bottom: 1px solid var(--border);
  padding: 7px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
  flex-wrap: wrap;
  min-height: 44px;
}

.app-title {
  font-size: 13px; font-weight: 700;
  color: var(--bright); white-space: nowrap; letter-spacing: -0.3px;
}
.app-title em    { color: var(--accent); font-style: normal; }
.app-title small { color: var(--dim); font-weight: 400; font-size: 12px; }

.vdiv { width: 1px; height: 18px; background: var(--border); flex-shrink: 0; }

.upload-btn {
  position: relative; display: inline-flex; align-items: center;
  gap: 5px; padding: 4px 10px;
  border: 1px dashed var(--border); border-radius: 6px;
  cursor: pointer; color: var(--dim); font-size: 11px;
  transition: all 0.15s; white-space: nowrap; user-select: none;
}
.upload-btn:hover  { border-color: var(--accent); color: var(--text); background: rgba(88,166,255,0.05); }
.upload-btn.loaded { border-style: solid; border-color: var(--accent); color: var(--accent); background: rgba(88,166,255,0.08); }
.upload-btn input  { position: absolute; inset: 0; opacity: 0; cursor: pointer; font-size: 0; }

/* model toggle — same style as dmpbridge.html */
.tog-grp { display: inline-flex; border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
.tog-opt {
  padding: 3px 10px; font-size: 11px; cursor: pointer; user-select: none;
  background: var(--s3); color: var(--dim); border-right: 1px solid var(--border);
  transition: all 0.1s;
}
.tog-opt:last-child { border-right: none; }
.tog-opt:hover { background: var(--s2); color: var(--text); }
.tog-opt.on    { background: rgba(88,166,255,0.15); color: var(--accent); }

.chip {
  display: inline-flex; align-items: center; gap: 3px;
  padding: 2px 8px; background: var(--s3);
  border: 1px solid var(--border); border-radius: 20px;
  font-size: 10px; color: var(--dim); white-space: nowrap;
}
.chip b { font-weight: 600; }
.chip.ok  { border-color: rgba(63,185,80,0.35); }  .chip.ok  b { color: var(--green); }
.chip.err { border-color: rgba(220,38,38,0.35); }  .chip.err b { color: var(--red); }

.spacer { flex: 1; }

/* ── Main layout ── */
.main { flex: 1; display: flex; overflow: hidden; }

.col { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }

.col-bar {
  background: var(--s1); border-bottom: 1px solid var(--border);
  padding: 5px 12px; display: flex; align-items: center; gap: 8px;
  flex-shrink: 0; min-height: 34px;
}
.col-bar-title { font-size: 11px; font-weight: 600; color: var(--dim); }
.col-bar-title.manual { color: var(--green); }
.col-bar-title.model  { color: var(--accent); }

.col-body { flex: 1; overflow-y: auto; }

/* ── Label count bar ── */
.col-counts {
  background: var(--s2); border-bottom: 1px solid var(--border);
  padding: 5px 12px; display: flex; flex-wrap: wrap; gap: 6px;
  flex-shrink: 0;
}
.cnt-item {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 10px;
}
.cnt-n {
  font-weight: 700; font-size: 11px; min-width: 14px; text-align: center;
}
.cnt-ok  { color: var(--green); }
.cnt-err { color: var(--red); }
.cnt-diff { font-size: 9px; color: var(--red); }

.col-sep { width: 1px; background: var(--border); flex-shrink: 0; }

/* ── Label badges — exact same as dmpbridge.html ── */
.lbl {
  display: inline-block; padding: 2px 6px; border-radius: 3px;
  font-size: 10px; font-weight: 700; white-space: nowrap; flex-shrink: 0;
  width: 76px; text-align: center;
}
.lbl-title               { background: rgba(220,38,38,0.15);  color: #fca5a5; border: 1px solid rgba(220,38,38,0.45); }
.lbl-section-title       { background: rgba(34,197,94,0.15);  color: #86efac; border: 1px solid rgba(34,197,94,0.45); }
.lbl-section-description { background: rgba(59,130,246,0.15); color: #93c5fd; border: 1px solid rgba(59,130,246,0.45); }
.lbl-question-text       { background: rgba(245,158,11,0.15); color: #fcd34d; border: 1px solid rgba(245,158,11,0.45); }
.lbl-answer-text         { background: rgba(168,85,247,0.15); color: #d8b4fe; border: 1px solid rgba(168,85,247,0.45); }

/* ── Block rows ── */
.block {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 7px 12px;
  border-bottom: 1px solid rgba(48,54,61,0.45);
  transition: background 0.1s;
}
.block:hover { background: rgba(88,166,255,0.04); }

/* left color stripe by label type */
.block[data-label="title"]               { border-left: 3px solid rgba(220,38,38,0.75); }
.block[data-label="section.title"]       { border-left: 3px solid rgba(34,197,94,0.75); }
.block[data-label="section.description"] { border-left: 3px solid rgba(59,130,246,0.75); background: rgba(59,130,246,0.02); }
.block[data-label="question.text"]       { border-left: 3px solid rgba(245,158,11,0.75); }
.block[data-label="answer.text"]         { border-left: 3px solid rgba(168,85,247,0.45); }

/* indentation by block type */
.block[data-label="section.description"] .block-text,
.block[data-label="question.text"]       .block-text,
.block[data-label="answer.text"]         .block-text { padding-left: 4px; }

.block-text {
  flex: 1; font-size: 12px; color: var(--text);
  line-height: 1.6; white-space: pre-wrap; word-break: break-word;
  min-width: 0;
}

/* title block — larger, brighter */
.block[data-label="title"] .block-text {
  font-size: 13px; font-weight: 600; color: var(--bright);
}
/* section title — medium weight */
.block[data-label="section.title"] .block-text {
  font-weight: 600; color: #86efac;
}
/* section description — dim */
.block[data-label="section.description"] .block-text {
  color: #93c5fd; font-size: 11px;
}
/* question — gold */
.block[data-label="question.text"] .block-text {
  color: #fcd34d; font-size: 12px; font-weight: 500;
}
/* answer — softer */
.block[data-label="answer.text"] .block-text {
  color: var(--text); font-size: 12px;
}

/* ── Error / warning states ── */
.block.warn { background: rgba(240,136,62,0.05) !important; }
.block.warn[data-label="section.title"] { border-left-color: rgba(240,136,62,0.8); }
.block.warn[data-label="question.text"] { border-left-color: rgba(240,136,62,0.8); }
.block.empty-ans { background: rgba(220,38,38,0.04) !important; }
.block.empty-ans[data-label="answer.text"] { border-left-color: rgba(220,38,38,0.6); }

.wb {
  display: inline-block; font-size: 9px; font-weight: 700;
  padding: 1px 5px; border-radius: 3px; margin-left: 6px;
  background: rgba(240,136,62,0.18); color: var(--orange);
  border: 1px solid rgba(240,136,62,0.35); vertical-align: middle; white-space: nowrap;
}
.eb {
  display: inline-block; font-size: 9px; font-weight: 700;
  padding: 1px 5px; border-radius: 3px; margin-left: 6px;
  background: rgba(220,38,38,0.18); color: var(--red);
  border: 1px solid rgba(220,38,38,0.35); vertical-align: middle; white-space: nowrap;
}
.empty-text { color: var(--red) !important; font-style: italic; }

/* diff counts */
.dk { color: var(--green); font-size: 10px; }
.de { color: var(--red);   font-size: 10px; }

/* ── Empty state ── */
.empty-state {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; height: 100%; gap: 10px; color: var(--dim);
}
.empty-icon { font-size: 40px; opacity: 0.18; }
.empty-state p { font-size: 12px; }

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--s3); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--border); }
</style>
</head>
<body>

<header class="header">
  <span class="app-title">dmp<em>bridge</em> <small>— structured review</small></span>
  <div class="vdiv"></div>

  <label class="upload-btn" id="btn-manual">
    <span id="lbl-manual">📋 Load manual JSON</span>
    <input type="file" id="in-manual" accept=".json">
  </label>

  <div class="vdiv"></div>

  <label class="upload-btn" id="btn-ma">
    <span id="lbl-ma">🤖 Load Model A</span>
    <input type="file" id="in-ma" accept=".json">
  </label>

  <label class="upload-btn" id="btn-mb">
    <span id="lbl-mb">🤖 Load Model B</span>
    <input type="file" id="in-mb" accept=".json">
  </label>

  <div class="tog-grp" id="model-tog">
    <div class="tog-opt on" data-m="ma">Model A</div>
    <div class="tog-opt"    data-m="mb">Model B</div>
  </div>

  <div class="spacer"></div>
  <span id="hdr-stats" style="font-size:10px;color:var(--dim);"></span>
</header>

<div class="main">

  <!-- Left: Manual -->
  <div class="col">
    <div class="col-bar">
      <span class="col-bar-title manual">Manual Label</span>
      <span id="stats-manual" style="font-size:10px;color:var(--dim);margin-left:4px;"></span>
    </div>
    <div class="col-counts" id="counts-manual"></div>
    <div class="col-body" id="body-manual">
      <div class="empty-state">
        <div class="empty-icon">📋</div>
        <p>Load a manual JSON file</p>
        <p style="font-size:11px;">e.g. data/manuallabeled/sample1_dmp.json</p>
      </div>
    </div>
  </div>

  <div class="col-sep"></div>

  <!-- Right: selected model -->
  <div class="col">
    <div class="col-bar">
      <span class="col-bar-title model" id="model-col-title">LLM Output</span>
      <span id="stats-model" style="font-size:10px;margin-left:4px;"></span>
    </div>
    <div class="col-counts" id="counts-model"></div>
    <div class="col-body" id="body-model">
      <div class="empty-state">
        <div class="empty-icon">🤖</div>
        <p>Load Model A or Model B JSON</p>
        <p style="font-size:11px;">e.g. data/llmlabeled/sample1_llama3.3-70b_structured.json</p>
      </div>
    </div>
  </div>

</div>

<script>
// ── Error detection ──────────────────────────────────────────────────────────
// Matches list items like (i), (ii), (iii), (iv) — body text mis-labeled as section
const ROMAN_RE = /^\(i{1,3}v?i*\)/i;

function suspSec(t) {
  if (!t)                       return 'Empty section title';
  if (/^[a-z]/.test(t))         return 'Starts lowercase';
  if (ROMAN_RE.test(t))         return 'List item in section title';
  if (t.endsWith('.') && !/\d\.\s/.test(t)) return 'Ends with period';
  return null;
}
function suspQ(t) {
  if (!t)               return null;
  if (/^[a-z]/.test(t)) return 'Starts lowercase';
  return null;
}

// ── Flatten structured JSON → ordered labeled blocks ─────────────────────────
function flatten(data) {
  const blocks = [];
  const t = data.narrative.template;
  if (t.title) blocks.push({ label: 'title', text: t.title });
  for (const s of (t.section || [])) {
    if (s.title)       blocks.push({ label: 'section.title',       text: s.title });
    if (s.description) blocks.push({ label: 'section.description', text: s.description });
    for (const q of (s.question || [])) {
      if (q.text) blocks.push({ label: 'question.text', text: q.text });
      const ans = q.answer?.json?.answer || '';
      blocks.push({ label: 'answer.text', text: ans, empty: !ans });
    }
  }
  return blocks;
}

// ── HTML rendering ───────────────────────────────────────────────────────────
function esc(s) {
  return String(s || '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

const LABEL_SHORT = {
  'title':               'Title',
  'section.title':       'Sec Title',
  'section.description': 'Sec Desc',
  'question.text':       'Question',
  'answer.text':         'Answer',
};

const LABEL_CSS = {
  'title':               'lbl-title',
  'section.title':       'lbl-section-title',
  'section.description': 'lbl-section-description',
  'question.text':       'lbl-question-text',
  'answer.text':         'lbl-answer-text',
};

function renderBlocks(blocks, generated = false) {
  if (!blocks.length) return '<div style="padding:20px;color:var(--dim);">No content</div>';
  return blocks.map(b => {
    const warn  = generated && b.label === 'section.title' ? suspSec(b.text) : null;
    const warnQ = generated && b.label === 'question.text' ? suspQ(b.text)   : null;
    const anyWarn = warn || warnQ;
    const isEmpty = generated && b.empty;

    let cls = 'block';
    if (anyWarn) cls += ' warn';
    if (isEmpty) cls += ' empty-ans';

    let textHtml;
    if (isEmpty) {
      textHtml = `<span class="empty-text">Empty answer</span><span class="eb">✕ empty</span>`;
    } else {
      textHtml = esc(b.text) + (anyWarn ? `<span class="wb">⚠ ${esc(anyWarn)}</span>` : '');
    }

    return (
      `<div class="${cls}" data-label="${b.label}">` +
      `<span class="lbl ${LABEL_CSS[b.label]}">${LABEL_SHORT[b.label]}</span>` +
      `<div class="block-text">${textHtml}</div>` +
      `</div>`
    );
  }).join('');
}

// ── State ────────────────────────────────────────────────────────────────────
const state = {
  manual: null,
  ma:     null,
  mb:     null,
  active: 'ma',   // which model is shown
};

function countIssues(blocks) {
  return blocks.filter(b =>
    (b.label === 'section.title' && suspSec(b.text)) ||
    (b.label === 'question.text' && suspQ(b.text))   ||
    (b.label === 'answer.text'   && b.empty)
  ).length;
}

function blockStats(blocks) {
  const c = { title:0, 'section.title':0, 'section.description':0, 'question.text':0, 'answer.text':0 };
  blocks.forEach(b => { if (c[b.label] !== undefined) c[b.label]++; });
  return c;
}

const LABEL_DEFS = [
  { key: 'title',               css: 'lbl-title',               short: 'Title' },
  { key: 'section.title',       css: 'lbl-section-title',       short: 'Sec Title' },
  { key: 'section.description', css: 'lbl-section-description', short: 'Sec Desc' },
  { key: 'question.text',       css: 'lbl-question-text',       short: 'Question' },
  { key: 'answer.text',         css: 'lbl-answer-text',         short: 'Answer' },
];

function renderCounts(elId, stats, refStats) {
  const el = document.getElementById(elId);
  if (!el) return;
  el.innerHTML = LABEL_DEFS.map(d => {
    const n   = stats[d.key] || 0;
    const ref = refStats ? (refStats[d.key] || 0) : null;
    const match = ref === null || n === ref;
    const nCls  = ref === null ? '' : (match ? 'cnt-ok' : 'cnt-err');
    const diff  = (ref !== null && !match)
      ? `<span class="cnt-diff">≠${ref}</span>`
      : '';
    return (
      `<span class="cnt-item">` +
      `<span class="lbl ${d.css}" style="width:auto;padding:1px 5px;">${d.short}</span>` +
      `<span class="cnt-n ${nCls}">${n}</span>${diff}` +
      `</span>`
    );
  }).join('');
}

function render() {
  // Manual column
  let manualStats = null;
  if (state.manual) {
    const blocks = flatten(state.manual);
    document.getElementById('body-manual').innerHTML = renderBlocks(blocks, false);
    manualStats = blockStats(blocks);
    renderCounts('counts-manual', manualStats, null);
    document.getElementById('stats-manual').innerHTML = '';
  } else {
    document.getElementById('counts-manual').innerHTML = '';
  }

  // Model column
  const modelData = state[state.active];
  const modelTitle = document.getElementById('model-col-title');
  modelTitle.textContent = state.active === 'ma' ? 'Model A' : 'Model B';

  if (modelData) {
    const blocks  = flatten(modelData);
    const issues  = countIssues(blocks);
    const s       = blockStats(blocks);
    document.getElementById('body-model').innerHTML = renderBlocks(blocks, true);
    renderCounts('counts-model', s, manualStats);

    const issueChip = issues
      ? `<span class="chip err"><b>${issues}</b> issue${issues!==1?'s':''}</span>`
      : `<span class="chip ok">✓ <b>clean</b></span>`;
    document.getElementById('stats-model').innerHTML = issueChip;
  } else {
    document.getElementById('body-model').innerHTML =
      `<div class="empty-state"><div class="empty-icon">🤖</div>` +
      `<p>Load ${state.active === 'ma' ? 'Model A' : 'Model B'} JSON</p></div>`;
    document.getElementById('stats-model').innerHTML = '';
    document.getElementById('counts-model').innerHTML = '';
  }
}

// ── File loading ──────────────────────────────────────────────────────────────
function loadFile(key, file) {
  const r = new FileReader();
  r.onload = e => {
    try {
      state[key] = JSON.parse(e.target.result);
      document.getElementById('btn-' + key).classList.add('loaded');
      document.getElementById('lbl-' + key).textContent =
        (key === 'manual' ? '📋 ' : '🤖 ') + clip(file.name, 24);
      if (key === state.active || key === 'manual') render();
    } catch(err) { alert('JSON error: ' + err.message); }
  };
  r.readAsText(file);
}

['manual','ma','mb'].forEach(k => {
  document.getElementById('in-' + k).addEventListener('change', e => {
    const f = e.target.files[0];
    if (f) loadFile(k, f);
  });
});

// ── Model toggle ──────────────────────────────────────────────────────────────
document.querySelectorAll('#model-tog .tog-opt').forEach(opt => {
  opt.addEventListener('click', () => {
    document.querySelectorAll('#model-tog .tog-opt').forEach(o => o.classList.remove('on'));
    opt.classList.add('on');
    state.active = opt.dataset.m;
    render();
  });
});

// ── Drag & drop ───────────────────────────────────────────────────────────────
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => {
  e.preventDefault();
  const files = [...e.dataTransfer.files].filter(f => f.name.endsWith('.json'));
  const order = ['manual', 'ma', 'mb'];
  files.forEach((f, i) => { if (i < order.length) loadFile(order[i], f); });
});

// ── Helper ───────────────────────────────────────────────────────────────────
function clip(s, n) { return s.length > n ? s.slice(0, n) + '…' : s; }
</script>
</body>
</html>
