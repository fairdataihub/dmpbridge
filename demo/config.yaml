# Edit this file, then run:
#   python scripts/run_demo.py
#
# Each stage's result (one JSON per sample) is copied into its own folder under
# demo/output/ when it finishes: extracted/, labeled/, structured/, final/,
# and with the rda: block below also rda/ and merged/.

name: Demo run
strategy: wholedoc
provider: ollama
host: http://localhost:11434

# Which model does which part - any model already pulled in Ollama.
#
# narrative: labels the plan's text and builds the DMP Tool JSON (stages 2-4).
narrative:
  model: gemma4:e4b

# rda: fills in the RDA maDMP JSON from the same text (stage 5), then merged with
# the narrative JSON (stage 6). Delete this block for the narrative part only.
rda:
  model: gemma4:e4b

# How the PDF is read. pdfplumber handles a normal PDF with a real text layer;
# if that text comes out garbled (a scanned page, or fonts with no character
# mapping) the document is re-read from its page images by LightOnOCR instead.
# Per document — clean PDFs never touch the fallback.
extractor: pdfplumber       # pdfplumber | lightonocr | docling
fallback: auto              # auto = LightOnOCR 

pdf_dir: data/input/pdfs    # expects sample1.pdf, sample2.pdf, ...
sample_start: 3
sample_end: 3              # keep this small for a quick demo run
